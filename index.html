<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Scribe is a lightweight, distraction-free operating system designed for writing."
  >

  <title>Scribe | Write Without Distractions</title>

  <style>
    :root {
      --bg-dark: #111827;
      --bg-dark-2: #1f2937;
      --surface: #ffffff;
      --surface-alt: #f3f4f6;
      --text: #111827;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #e5e7eb;
      --warning: #f59e0b;
      --warning-bg: #fffbeb;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.7;
      color: var(--text);
      background: #fafafa;
    }

    a {
      color: inherit;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .container {
      width: min(1120px, 90%);
      margin: 0 auto;
    }

    .hero {
      min-height: 72vh;
      display: grid;
      place-items: center;
      padding: 80px 20px;
      color: #ffffff;
      text-align: center;
      background: linear-gradient(
        135deg,
        var(--bg-dark),
        var(--bg-dark-2)
      );
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 18px;
      padding: 6px 12px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      color: #dbeafe;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hero h1 {
      margin-bottom: 24px;
      font-size: clamp(3rem, 9vw, 5.5rem);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .hero .tagline {
      max-width: 760px;
      margin: 0 auto;
      color: #e5e7eb;
      font-size: clamp(1.1rem, 3vw, 1.45rem);
    }

    .hero-image {
      width: 100%;
      max-width: 1000px;
      margin: 40px auto 0;
    }

    .hero-image img {
      width: 100%;
      height: auto;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .hero-image figcaption {
      margin-top: 12px;
      color: #d1d5db;
      font-size: 0.92rem;
    }

    .cta-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 38px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 13px 24px;
      border: 2px solid transparent;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      color: var(--accent-hover);
      background: #ffffff;
    }

    .btn-primary:hover {
      background: #eff6ff;
    }

    .btn-secondary {
      color: #ffffff;
      background: var(--accent);
    }

    .btn-secondary:hover {
      background: var(--accent-hover);
    }

    .btn-outline {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.55);
      background: transparent;
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    section {
      padding: 82px 0;
    }

    .alt {
      background: var(--surface-alt);
    }

    .section-title {
      margin-bottom: 18px;
      text-align: center;
      font-size: clamp(2rem, 5vw, 2.7rem);
      line-height: 1.15;
      letter-spacing: -0.025em;
    }

    .section-subtitle {
      max-width: 760px;
      margin: 0 auto 46px;
      color: var(--muted);
      text-align: center;
      font-size: 1.08rem;
    }
